<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>МОЇ ЛЮДИ kahoot! — Гравець</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #46178f; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 100vh; text-align: center; }
    .brand { font-size: 32px; font-weight: bold; margin-top: 20px; letter-spacing: 1px; }
    .brand span { color: #f2a900; }
    .card { background: rgba(255, 255, 255, 0.1); padding: 25px; border-radius: 12px; width: 85%; max-width: 400px; backdrop-filter: blur(10px); margin: auto; }
    input[type="text"] { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: none; font-size: 18px; text-align: center; box-sizing: border-box; }
    .btn { background: #333; color: #fff; border: none; padding: 14px; width: 100%; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 90%; max-width: 500px; margin: 20px auto; }
    .ans-btn { height: 120px; border-radius: 8px; border: none; cursor: pointer; transition: transform 0.1s; font-size: 22px; font-weight: bold; color: #fff; display: flex; align-items: center; justify-content: center; }
    .ans-btn:active { transform: scale(0.95); }
    .blue { background: #1368ce; }
    .red { background: #e21b3c; }
    .yellow { background: #d89e00; }
    .green { background: #26890c; }
    #gameScreen, #waitingScreen, #resultScreen { display: none; }
    .footer { font-size: 12px; opacity: 0.5; margin-bottom: 15px; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="brand">МОЇ ЛЮДИ <span>kahoot!</span></div>

  <div id="loginScreen" class="card">
    <h2>Вхід у гру</h2>
    <input type="text" id="pinInput" placeholder="PIN код (на екрані)">
    <input type="text" id="nameInput" placeholder="Ваше ім'я">
    <button class="btn" style="background: #26890c;" onclick="joinGame()">ПОЇХАЛИ</button>
    <p id="loginErr" style="color: #ff4757; margin-top: 10px;"></p>
  </div>

  <div id="waitingScreen" class="card">
    <h2 id="waitTitle">Ви в грі!</h2>
    <p id="waitSub">Дивіться на головний екран...</p>
  </div>

  <div id="gameScreen" style="width:100%;">
    <h3 id="qIndexText" style="margin-bottom: 10px;">Питання 1</h3>
    <div class="grid" id="playerGrid"></div>
  </div>

  <div id="resultScreen" class="card">
    <h1 id="resTitle"></h1>
    <p id="resScore"></p>
    <h2 id="resRank" style="color:#f2a900; margin-top:15px;"></h2>
  </div>

  <div class="footer">by pogrebnyak</div>

  <script>
    const socket = io();
    const urlParams = new URLSearchParams(window.location.search);
    const pinFromUrl = urlParams.get('pin');

    if (pinFromUrl) {
      document.getElementById('pinInput').value = pinFromUrl;
    }

    function joinGame() {
      const pin = document.getElementById('pinInput').value;
      const name = document.getElementById('nameInput').value;
      if (!pin) return alert('Введіть PIN код!');
      if (!name) return alert('Введіть ім\'я!');

      socket.emit('player-join', { pin, name }, (res) => {
        if (res.success) {
          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('waitingScreen').style.display = 'block';
        } else {
          document.getElementById('loginErr').innerText = res.message;
        }
      });
    }

    socket.on('start-countdown', () => {
      document.getElementById('waitingScreen').style.display = 'block';
      document.getElementById('waitTitle').innerText = 'ПРИГОТУЙТЕСЯ!';
      document.getElementById('waitSub').innerText = 'Гра зараз розпочнеться...';
    });

    socket.on('show-question-player', (data) => {
      document.getElementById('waitingScreen').style.display = 'none';
      document.getElementById('resultScreen').style.display = 'none';
      document.getElementById('gameScreen').style.display = 'block';
      document.getElementById('qIndexText').innerText = `Питання ${data.questionIndex}`;

      const grid = document.getElementById('playerGrid');
      grid.innerHTML = '';

      if (data.type === 'true_false') {
        grid.style.gridTemplateColumns = '1fr 1fr';
        grid.innerHTML = `
          <button class="ans-btn blue" onclick="submitAnswer(0)">Правда</button>
          <button class="ans-btn red" onclick="submitAnswer(1)">Неправда</button>
        `;
      } else {
        grid.style.gridTemplateColumns = '1fr 1fr';
        grid.innerHTML = `
          <button class="ans-btn red" onclick="submitAnswer(0)"></button>
          <button class="ans-btn blue" onclick="submitAnswer(1)"></button>
          <button class="ans-btn yellow" onclick="submitAnswer(2)"></button>
          <button class="ans-btn green" onclick="submitAnswer(3)"></button>
        `;
      }
    });

    function submitAnswer(idx) {
      socket.emit('submit-answer', { optionIndex: idx });
      document.getElementById('gameScreen').style.display = 'none';
      document.getElementById('waitingScreen').style.display = 'block';
      document.getElementById('waitTitle').innerText = 'Відповідь прийнято!';
      document.getElementById('waitSub').innerText = 'Чекаємо інших гравців...';
    }

    socket.on('answer-result', (data) => {
      document.getElementById('waitingScreen').style.display = 'none';
      document.getElementById('resultScreen').style.display = 'block';
      if (data.isCorrect) {
        document.getElementById('resTitle').innerText = '🔥 ПРАВИЛЬНО!';
        document.getElementById('resTitle').style.color = '#26890c';
      } else {
        document.getElementById('resTitle').innerText = '❌ НЕВГАДАВ';
        document.getElementById('resTitle').style.color = '#e21b3c';
      }
      document.getElementById('resScore').innerText = `Ваші бали: ${data.score}`;
      document.getElementById('resRank').innerText = `Ви на ${data.rank} місці з ${data.total}!`;
    });

    socket.on('round-ended', () => {
      setTimeout(() => {
        document.getElementById('resultScreen').style.display = 'none';
        document.getElementById('waitingScreen').style.display = 'block';
        document.getElementById('waitTitle').innerText = 'Раунд завершено';
        document.getElementById('waitSub').innerText = 'Дивіться на головний екран...';
      }, 2000);
    });

    socket.on('kicked', () => {
      alert('Ви були видалені ведучим!');
      location.reload();
    });

    socket.on('game-over', () => {
      document.getElementById('waitingScreen').style.display = 'block';
      document.getElementById('resultScreen').style.display = 'none';
      document.getElementById('gameScreen').style.display = 'none';
      document.getElementById('waitTitle').innerText = '🏆 Гра закінчена!';
      document.getElementById('waitSub').innerText = 'Дякуємо за участь!';
    });
  </script>
</body>
</html>
