<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>МОЇ ЛЮДИ kahoot — Игрок</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #46178f; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
    .brand { font-size: 32px; font-weight: bold; margin-bottom: 20px; letter-spacing: 1px; }
    .brand span { color: #f2a900; }
    .card { background: rgba(255, 255, 255, 0.1); padding: 25px; border-radius: 12px; width: 85%; max-width: 400px; backdrop-filter: blur(10px); }
    input[type="text"] { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: none; font-size: 18px; text-align: center; box-sizing: border-box; }
    .btn { background: #333; color: #fff; border: none; padding: 14px; width: 100%; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 90%; max-width: 500px; margin-top: 20px; }
    .ans-btn { height: 120px; border-radius: 8px; border: none; cursor: pointer; transition: transform 0.1s; }
    .ans-btn:active { transform: scale(0.95); }
    .red { background: #e21b3c; }
    .blue { background: #1368ce; }
    .yellow { background: #d89e00; }
    .green { background: #26890c; }
    #gameScreen, #waitingScreen, #resultScreen { display: none; }
  </style>
</head>
<body>
  <div class="brand">МОЇ ЛЮДИ <span>kahoot</span></div>

  <div id="loginScreen" class="card">
    <h2>Вход в игру</h2>
    <input type="text" id="pinInput" placeholder="PIN код (1234)">
    <input type="text" id="nameInput" placeholder="Ваше имя">
    <button class="btn" style="background: #26890c;" onclick="joinGame()">ПОЕХАЛИ</button>
    <p id="loginErr" style="color: #ff4757; margin-top: 10px;"></p>
  </div>

  <div id="waitingScreen" class="card">
    <h2 id="waitTitle">Вы в игре!</h2>
    <p id="waitSub">Смотрите на главный экран...</p>
  </div>

  <div id="gameScreen">
    <h3 id="qIndexText" style="margin-bottom: 10px;">Вопрос 1</h3>
    <div class="grid">
      <button class="ans-btn red" onclick="submitAnswer(0)"></button>
      <button class="ans-btn blue" onclick="submitAnswer(1)"></button>
      <button class="ans-btn yellow" onclick="submitAnswer(2)"></button>
      <button class="ans-btn green" onclick="submitAnswer(3)"></button>
    </div>
  </div>

  <div id="resultScreen" class="card">
    <h1 id="resTitle"></h1>
    <p id="resScore"></p>
    <h2 id="resRank" style="color:#f2a900; margin-top:15px;"></h2>
  </div>

  <script>
    const socket = io();

    function joinGame() {
      const pin = document.getElementById('pinInput').value;
      const name = document.getElementById('nameInput').value;
      if (!name) return alert('Введите имя!');

      socket.emit('player-join', { pin, name }, (res) => {
        if (res.success) {
          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('waitingScreen').style.display = 'block';
        } else {
          document.getElementById('loginErr').innerText = res.message;
        }
      });
    }

    socket.on('show-question-player', (data) => {
      document.getElementById('waitingScreen').style.display = 'none';
      document.getElementById('resultScreen').style.display = 'none';
      document.getElementById('gameScreen').style.display = 'block';
      document.getElementById('qIndexText').innerText = `Вопрос ${data.questionIndex}`;
    });

    function submitAnswer(idx) {
      socket.emit('submit-answer', { optionIndex: idx });
      document.getElementById('gameScreen').style.display = 'none';
      document.getElementById('waitingScreen').style.display = 'block';
      document.getElementById('waitTitle').innerText = 'Ответ принят!';
      document.getElementById('waitSub').innerText = 'Ждём остальных игроков...';
    }

    socket.on('answer-result', (data) => {
      document.getElementById('waitingScreen').style.display = 'none';
      document.getElementById('resultScreen').style.display = 'block';
      if (data.isCorrect) {
        document.getElementById('resTitle').innerText = '🔥 ПРАВИЛЬНО!';
        document.getElementById('resTitle').style.color = '#26890c';
      } else {
        document.getElementById('resTitle').innerText = '❌ НЕУГАДАЛ';
        document.getElementById('resTitle').style.color = '#e21b3c';
      }
      document.getElementById('resScore').innerText = `Ваши очки: ${data.score}`;
      document.getElementById('resRank').innerText = `Вы на ${data.rank} месте из ${data.total}!`;
    });

    socket.on('round-ended', () => {
      setTimeout(() => {
        document.getElementById('resultScreen').style.display = 'none';
        document.getElementById('waitingScreen').style.display = 'block';
        document.getElementById('waitTitle').innerText = 'Раунд завершен';
        document.getElementById('waitSub').innerText = 'Внимание на главный экран!';
      }, 2000);
    });

    socket.on('kicked', () => {
      alert('Вы были удалены ведущим из комнаты!');
      location.reload();
    });

    socket.on('game-over', () => {
      document.getElementById('waitingScreen').style.display = 'block';
      document.getElementById('resultScreen').style.display = 'none';
      document.getElementById('gameScreen').style.display = 'none';
      document.getElementById('waitTitle').innerText = '🏆 Игра окончена!';
      document.getElementById('waitSub').innerText = 'Спасибо за участие!';
    });
  </script>
</body>
</html>
