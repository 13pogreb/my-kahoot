<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>МОЇ ЛЮДИ kahoot! — Конструктор</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #fff; margin: 0; padding: 20px; }
    .container { max-width: 850px; margin: 0 auto; background: #16213e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .brand { text-transform: uppercase; letter-spacing: 2px; text-align: center; font-size: 28px; font-weight: bold; margin-bottom: 20px; }
    .brand span { color: #e94560; }
    .nav-bar { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 25px; background: #0f3460; padding: 12px; border-radius: 8px; flex-wrap: wrap; }
    .nav-btn { background: #26890c; color: #fff; text-decoration: none; padding: 12px 20px; border-radius: 6px; font-weight: bold; font-size: 16px; display: inline-block; transition: 0.2s; border: none; cursor: pointer; text-align: center; flex: 1; }
    .nav-btn:hover { background: #2ed573; }
    .action-bar { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
    .action-bar button, .action-bar label { flex: 1; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="number"], input[type="file"], select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #0f3460; background: #0f3460; color: #fff; box-sizing: border-box; }
    .btn { background: #e94560; color: #fff; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.2s; }
    .btn-secondary { background: #0f3460; border: 1px solid #e94560; }
    .question-card { background: #0f3460; padding: 15px; border-radius: 8px; margin-bottom: 15px; position: relative; }
    .controls-btn-group { position: absolute; top: 15px; right: 15px; display: flex; gap: 5px; }
    .icon-btn { background: #16213e; color: #fff; border: 1px solid #e94560; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    .icon-btn:hover { background: #e94560; }
    .room-launched-box { background: #26890c; padding: 20px; border-radius: 10px; margin-bottom: 25px; text-align: center; }
    .footer { text-align: center; font-size: 12px; opacity: 0.5; margin-top: 25px; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="container" id="adminContainer" style="display: none;">
    <div class="brand">МОЇ ЛЮДИ <span>kahoot!</span></div>

    <div id="roomLaunchArea" style="margin-bottom: 25px;">
      <button class="nav-btn" onclick="createRoomAndStart()" style="width:100%; font-size: 20px; padding: 15px;">🚀 ЗАПУСТИТИ ГРУ ДЛЯ ЦІЄЇ ВІКТОРИНИ</button>
    </div>

    <div id="roomSuccessArea" class="room-launched-box" style="display: none;">
      <h2>🎉 КІМНАТА СТВОРЕНА! PIN: <span id="createdPinText" style="font-size:36px; color:#f2a900;"></span></h2>
      <div style="display:flex; gap:10px; justify-content:center; margin-top:15px; flex-wrap:wrap;">
        <button onclick="openHostWindow()" class="btn" style="background:#1368ce;">📺 Відкрити Екран Ведучого</button>
        <button onclick="openTVWindow()" class="btn" style="background:#8854d0;">🖥 Вивести на ТВ / Проектор</button>
      </div>
    </div>

    <div class="action-bar">
      <button class="btn btn-secondary" onclick="exportQuiz()">💾 Скачати (.json)</button>
      <label class="btn btn-secondary" style="margin:0; cursor:pointer;">
        📂 Завантажити з ПК
        <input type="file" id="importFileInput" accept=".json" style="display:none;" onchange="importQuiz(event)">
      </label>
      <button class="btn" style="background:#ff4757;" onclick="clearQuiz()">🗑 Очистити все</button>
    </div>

    <h2>Додати нове питання</h2>
    <form id="addQuestionForm" enctype="multipart/form-data">
      <div class="form-group">
        <label>Тип питания:</label>
        <select id="qType" onchange="toggleTypeFields()">
          <option value="quiz">Викторина (4 варианты)</option>
          <option value="true_false">Правда / Ложь (2 варианты)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Текст питання:</label>
        <input type="text" id="questionText" required placeholder="Введіть питання">
      </div>
      <div class="form-group">
        <label>Картинка (необов'язково):</label>
        <input type="file" id="imageFile" accept="image/*">
      </div>
      <div class="form-group">
        <label>Час на відповідь (сек):</label>
        <input type="number" id="timeLimit" value="20" required>
      </div>

      <div id="quizOptionsBlock">
        <div class="form-group"><label>Варіант 1 (Червоний):</label><input type="text" id="opt0" value="Вариант 1"></div>
        <div class="form-group"><label>Варіант 2 (Синій):</label><input type="text" id="opt1" value="Вариант 2"></div>
        <div class="form-group"><label>Варіант 3 (Жовтий):</label><input type="text" id="opt2" value="Вариант 3"></div>
        <div class="form-group"><label>Варіант 4 (Зелений):</label><input type="text" id="opt3" value="Вариант 4"></div>
      </div>

      <div class="form-group">
        <label>Правильна відповідь:</label>
        <select id="correctIndex"></select>
      </div>

      <button type="submit" class="btn" style="width:100%;">Зберегти питання</button>
    </form>

    <hr style="margin: 30px 0; border-color: #0f3460;">
    <h2>Питання у поточній вікторині</h2>
    <div id="questionsList"></div>

    <div class="footer">by pogrebnyak</div>
  </div>

  <script>
    let currentQuestions = [];
    let activePin = null;

    async function checkDirectAccess() {
      const key = sessionStorage.getItem('licenseKey');
      if (!key) {
        window.location.href = '/';
        return;
      }

      const res = await fetch('/api/license/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ licenseKey: key })
      });
      const data = await res.json();

      if (data.valid) {
        document.getElementById('adminContainer').style.display = 'block';
      } else {
        sessionStorage.removeItem('licenseKey');
        window.location.href = '/';
      }
    }

    async function createRoomAndStart() {
      if (currentQuestions.length === 0) {
        return alert('Спочатку додайте питання або завантажте вікторину з ПК!');
      }

      const licKey = sessionStorage.getItem('licenseKey');

      const res = await fetch('/api/rooms/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ questions: currentQuestions, licenseKey: licKey })
      });
      const data = await res.json();
      if (data.success) {
        activePin = data.pin;
        document.getElementById('createdPinText').innerText = activePin;
        document.getElementById('roomSuccessArea').style.display = 'block';
      } else {
        alert('Помилка доступу: ' + data.message);
        window.location.href = '/';
      }
    }

    function openHostWindow() {
      window.open(`/host.html?pin=${activePin}`, '_blank');
    }

    function openTVWindow() {
      window.open(`/host.html?pin=${activePin}`, 'KahootTVWindow', 'width=1280,height=720,menubar=no,toolbar=no,location=no');
    }

    function toggleTypeFields() {
      const type = document.getElementById('qType').value;
      const quizBlock = document.getElementById('quizOptionsBlock');
      const correctSelect = document.getElementById('correctIndex');

      if (type === 'true_false') {
        quizBlock.style.display = 'none';
        correctSelect.innerHTML = `
          <option value="0">Правда (Синий)</option>
          <option value="1">Ложь (Красный)</option>
        `;
      } else {
        quizBlock.style.display = 'block';
        correctSelect.innerHTML = `
          <option value="0">Вариант 1 (Красный)</option>
          <option value="1">Вариант 2 (Синий)</option>
          <option value="2">Вариант 3 (Желтый)</option>
          <option value="3">Вариант 4 (Зеленый)</option>
        `;
      }
    }

    function renderQuestions() {
      const container = document.getElementById('questionsList');
      container.innerHTML = '';
      currentQuestions.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        const isTF = q.type === 'true_false';
        card.innerHTML = `
          <div class="controls-btn-group">
            <button class="icon-btn" onclick="moveQuestion(${idx}, -1)">🔼</button>
            <button class="icon-btn" onclick="moveQuestion(${idx}, 1)">🔽</button>
            <button class="icon-btn" onclick="cloneQuestion(${idx})">📋</button>
            <button class="icon-btn" style="border-color:#ff4757;" onclick="deleteQuestion(${idx})">❌</button>
          </div>
          <h3>${idx + 1}. [${isTF ? 'Правда/Ложь' : 'Викторина'}] ${q.question}</h3>
          ${q.image ? `<img src="${q.image}" style="max-width:100%; max-height:150px; border-radius:6px; margin-bottom:10px;">` : ''}
          <p><strong>Відповіді:</strong> ${q.options.join(' | ')}</p>
          <p><strong>Правильный:</strong> ${q.options[q.correctIndex]} | <strong>Час:</strong> ${q.timeLimit}с</p>
        `;
        container.appendChild(card);
      });
    }

    function moveQuestion(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= currentQuestions.length) return;
      const temp = currentQuestions[index];
      currentQuestions[index] = currentQuestions[newIndex];
      currentQuestions[newIndex] = temp;
      renderQuestions();
    }

    function cloneQuestion(index) {
      const q = currentQuestions[index];
      const cloned = { ...q, id: Date.now(), question: q.question + ' (Копія)' };
      currentQuestions.push(cloned);
      renderQuestions();
    }

    document.getElementById('addQuestionForm').onsubmit = async (e) => {
      e.preventDefault();
      
      let imageUrl = null;
      const fileInput = document.getElementById('imageFile');
      if (fileInput.files[0]) {
        const formData = new FormData();
        formData.append('image', fileInput.files[0]);
        const uploadRes = await fetch('/api/upload-image', { method: 'POST', body: formData });
        const uploadData = await uploadRes.json();
        if (uploadData.success) imageUrl = uploadData.imageUrl;
      }

      const qType = document.getElementById('qType').value;
      let options = [];
      if (qType === 'true_false') {
        options = ['Правда', 'Неправда'];
      } else {
        options = [
          document.getElementById('opt0').value,
          document.getElementById('opt1').value,
          document.getElementById('opt2').value,
          document.getElementById('opt3').value
        ];
      }

      const newQ = {
        id: Date.now(),
        type: qType,
        question: document.getElementById('questionText').value,
        options,
        correctIndex: parseInt(document.getElementById('correctIndex').value, 10),
        timeLimit: parseInt(document.getElementById('timeLimit').value, 10) || 20,
        image: imageUrl
      };

      currentQuestions.push(newQ);
      document.getElementById('addQuestionForm').reset();
      toggleTypeFields();
      renderQuestions();
    };

    function deleteQuestion(index) {
      if (confirm('Видалити питання?')) {
        currentQuestions.splice(index, 1);
        renderQuestions();
      }
    }

    function exportQuiz() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentQuestions, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "quiz.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importQuiz(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          currentQuestions = JSON.parse(e.target.result);
          alert('Успішно завантажено!');
          renderQuestions();
        } catch (err) {
          alert('Помилка при читанні .json!');
        }
      };
      reader.readAsText(file);
    }

    function clearQuiz() {
      if (confirm('Очистити всі питання?')) {
        currentQuestions = [];
        renderQuestions();
      }
    }

    checkDirectAccess();
    toggleTypeFields();
  </script>
</body>
</html>
