<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>МОЇ ЛЮДИ kahoot! — Адмінка</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #fff; margin: 0; padding: 20px; }
    .container { max-width: 850px; margin: 0 auto; background: #16213e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .brand { text-transform: uppercase; letter-spacing: 2px; text-align: center; font-size: 28px; font-weight: bold; margin-bottom: 20px; }
    .brand span { color: #e94560; }
    .nav-bar { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 25px; background: #0f3460; padding: 12px; border-radius: 8px; flex-wrap: wrap; }
    .nav-btn { background: #e94560; color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; font-size: 14px; display: inline-block; transition: 0.2s; border: none; cursor: pointer; }
    .nav-btn:hover { background: #ff6b81; }
    .action-bar { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
    .action-bar button, .action-bar label { flex: 1; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="number"], input[type="file"], select { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #0f3460; background: #0f3460; color: #fff; box-sizing: border-box; }
    .btn { background: #e94560; color: #fff; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.2s; }
    .btn-secondary { background: #0f3460; border: 1px solid #e94560; }
    .question-card { background: #0f3460; padding: 15px; border-radius: 8px; margin-bottom: 15px; position: relative; }
    .controls-btn-group { position: absolute; top: 15px; right: 15px; display: flex; gap: 5px; }
    .icon-btn { background: #16213e; color: #fff; border: 1px solid #e94560; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    .icon-btn:hover { background: #e94560; }
    .footer { text-align: center; font-size: 12px; opacity: 0.5; margin-top: 25px; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">МОЇ ЛЮДИ <span>kahoot!</span></div>

    <div class="nav-bar">
      <a href="/" class="nav-btn" style="background:#0f3460; border: 1px solid #e94560;">🏠 Головне меню</a>
      <button onclick="openDisplayWindow()" class="nav-btn" style="background:#8854d0;">🖥 Відкрити екран на ТВ</button>
      <a href="/host.html" target="_blank" class="nav-btn" style="background:#26890c;">🚀 Екран Ведучого</a>
      <a href="/player.html" target="_blank" class="nav-btn" style="background:#0f3460; border: 1px solid #26890c;">📱 Екран Гравця</a>
    </div>

    <div class="action-bar">
      <button class="btn btn-secondary" onclick="exportQuiz()">💾 Скачати вікторину (.json)</button>
      <label class="btn btn-secondary" style="margin:0; cursor:pointer;">
        📂 Завантажити з ПК
        <input type="file" id="importFileInput" accept=".json" style="display:none;" onchange="importQuiz(event)">
      </label>
      <button class="btn" style="background:#ff4757;" onclick="clearQuiz()">🗑 Очистити все</button>
    </div>

    <h2>Додати нове питання</h2>
    <form id="addQuestionForm" enctype="multipart/form-data">
      <div class="form-group">
        <label>Тип питания:</label>
        <select id="qType" onchange="toggleTypeFields()">
          <option value="quiz">Викторина (4 варианта)</option>
          <option value="true_false">Правда / Ложь (2 варианта)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Текст питання:</label>
        <input type="text" id="questionText" required placeholder="Введіть питання">
      </div>
      <div class="form-group">
        <label>Картинка (необов'язково):</label>
        <input type="file" id="imageFile" accept="image/*">
      </div>
      <div class="form-group">
        <label>Час на відповідь (сек):</label>
        <input type="number" id="timeLimit" value="20" required>
      </div>

      <div id="quizOptionsBlock">
        <div class="form-group"><label>Варіант 1 (Червоний):</label><input type="text" id="opt0" value="Вариант 1"></div>
        <div class="form-group"><label>Варіант 2 (Синій):</label><input type="text" id="opt1" value="Вариант 2"></div>
        <div class="form-group"><label>Варіант 3 (Жовтий):</label><input type="text" id="opt2" value="Вариант 3"></div>
        <div class="form-group"><label>Варіант 4 (Зелений):</label><input type="text" id="opt3" value="Вариант 4"></div>
      </div>

      <div class="form-group">
        <label>Правильна відповідь:</label>
        <select id="correctIndex">
        </select>
      </div>

      <button type="submit" class="btn" style="width:100%;">Зберегти питання</button>
    </form>

    <hr style="margin: 30px 0; border-color: #0f3460;">
    <h2>Питання у поточній вікторині</h2>
    <div id="questionsList"></div>

    <div class="footer">by pogrebnyak</div>
  </div>

  <script>
    let currentQuestions = [];

    function openDisplayWindow() {
      window.open('/host.html', 'KahootDisplayWindow', 'width=1280,height=720,menubar=no,toolbar=no,location=no,status=no');
    }

    function toggleTypeFields() {
      const type = document.getElementById('qType').value;
      const quizBlock = document.getElementById('quizOptionsBlock');
      const correctSelect = document.getElementById('correctIndex');

      if (type === 'true_false') {
        quizBlock.style.display = 'none';
        correctSelect.innerHTML = `
          <option value="0">Правда (Синий)</option>
          <option value="1">Ложь (Красный)</option>
        `;
      } else {
        quizBlock.style.display = 'block';
        correctSelect.innerHTML = `
          <option value="0">Вариант 1 (Красный)</option>
          <option value="1">Вариант 2 (Синий)</option>
          <option value="2">Вариант 3 (Желтый)</option>
          <option value="3">Вариант 4 (Зеленый)</option>
        `;
      }
    }

    async function loadQuestions() {
      const res = await fetch('/api/questions');
      currentQuestions = await res.json();
      renderQuestions();
    }

    function renderQuestions() {
      const container = document.getElementById('questionsList');
      container.innerHTML = '';
      currentQuestions.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        const isTF = q.type === 'true_false';
        card.innerHTML = `
          <div class="controls-btn-group">
            <button class="icon-btn" onclick="moveQuestion(${idx}, -1)">🔼</button>
            <button class="icon-btn" onclick="moveQuestion(${idx}, 1)">🔽</button>
            <button class="icon-btn" onclick="cloneQuestion(${idx})">📋</button>
            <button class="icon-btn" style="border-color:#ff4757;" onclick="deleteQuestion(${q.id})">❌</button>
          </div>
          <h3>${idx + 1}. [${isTF ? 'Правда/Ложь' : 'Викторина'}] ${q.question}</h3>
          ${q.image ? `<img src="${q.image}" style="max-width:100%; max-height:150px; border-radius:6px; margin-bottom:10px;">` : ''}
          <p><strong>Відповіді:</strong> ${q.options.join(' | ')}</p>
          <p><strong>Правильный:</strong> ${q.options[q.correctIndex]} | <strong>Час:</strong> ${q.timeLimit}с</p>
        `;
        container.appendChild(card);
      });
    }

    async function moveQuestion(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= currentQuestions.length) return;
      const temp = currentQuestions[index];
      currentQuestions[index] = currentQuestions[newIndex];
      currentQuestions[newIndex] = temp;
      
      await fetch('/api/questions/reorder', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ questions: currentQuestions })
      });
      renderQuestions();
    }

    async function cloneQuestion(index) {
      const q = currentQuestions[index];
      const cloned = { ...q, id: Date.now(), question: q.question + ' (Копія)' };
      currentQuestions.push(cloned);
      await fetch('/api/questions/reorder', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ questions: currentQuestions })
      });
      renderQuestions();
    }

    document.getElementById('addQuestionForm').onsubmit = async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('type', document.getElementById('qType').value);
      formData.append('question', document.getElementById('questionText').value);
      formData.append('timeLimit', document.getElementById('timeLimit').value);
      formData.append('opt0', document.getElementById('opt0').value);
      formData.append('opt1', document.getElementById('opt1').value);
      formData.append('opt2', document.getElementById('opt2').value);
      formData.append('opt3', document.getElementById('opt3').value);
      formData.append('correctIndex', document.getElementById('correctIndex').value);
      
      const fileInput = document.getElementById('imageFile');
      if (fileInput.files[0]) {
        formData.append('image', fileInput.files[0]);
      }

      await fetch('/api/questions', { method: 'POST', body: formData });
      document.getElementById('addQuestionForm').reset();
      toggleTypeFields();
      loadQuestions();
    };

    async function deleteQuestion(id) {
      if (confirm('Видалити питання?')) {
        await fetch(`/api/questions/${id}`, { method: 'DELETE' });
        loadQuestions();
      }
    }

    function exportQuiz() {
      window.location.href = '/api/questions/export';
    }

    function importQuiz(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const questions = JSON.parse(e.target.result);
          await fetch('/api/questions/import', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ questions })
          });
          alert('Успішно завантажено!');
          loadQuestions();
        } catch (err) {
          alert('Помилка при читанні .json!');
        }
      };
      reader.readAsText(file);
    }

    async function clearQuiz() {
      if (confirm('Очистити всі питання?')) {
        await fetch('/api/questions/clear', { method: 'DELETE' });
        loadQuestions();
      }
    }

    toggleTypeFields();
    loadQuestions();
  </script>
</body>
</html>
