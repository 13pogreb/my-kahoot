<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>МОЇ ЛЮДИ kahoot — Админка</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #fff; margin: 0; padding: 20px; }
    .container { max-width: 850px; margin: 0 auto; background: #16213e; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .brand { text-transform: uppercase; letter-spacing: 2px; text-align: center; font-size: 28px; font-weight: bold; margin-bottom: 20px; }
    .brand span { color: #e94560; }
    .nav-bar { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 25px; background: #0f3460; padding: 12px; border-radius: 8px; }
    .nav-btn { background: #e94560; color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; font-size: 15px; display: inline-block; transition: 0.2s; }
    .nav-btn:hover { background: #ff6b81; }
    .action-bar { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
    .action-bar button, .action-bar label { flex: 1; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"], input[type="number"], input[type="file"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #0f3460; background: #0f3460; color: #fff; box-sizing: border-box; }
    .btn { background: #e94560; color: #fff; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.2s; }
    .btn-secondary { background: #0f3460; border: 1px solid #e94560; }
    .question-card { background: #0f3460; padding: 15px; border-radius: 8px; margin-bottom: 15px; position: relative; }
    .controls-btn-group { position: absolute; top: 15px; right: 15px; display: flex; gap: 5px; }
    .icon-btn { background: #16213e; color: #fff; border: 1px solid #e94560; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    .icon-btn:hover { background: #e94560; }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">МОЇ ЛЮДИ <span>kahoot</span></div>

    <div class="nav-bar">
      <a href="/" class="nav-btn" style="background:#0f3460; border: 1px solid #e94560;">🏠 Главное меню</a>
      <a href="/host.html" target="_blank" class="nav-btn" style="background:#26890c;">🚀 Экран Ведущего</a>
      <a href="/player.html" target="_blank" class="nav-btn" style="background:#0f3460; border: 1px solid #26890c;">📱 Экран Игрока</a>
    </div>

    <div class="action-bar">
      <button class="btn btn-secondary" onclick="exportQuiz()">💾 Скачать викторину (.json)</button>
      <label class="btn btn-secondary" style="margin:0; cursor:pointer;">
        📂 Загрузить викторину с ПК
        <input type="file" id="importFileInput" accept=".json" style="display:none;" onchange="importQuiz(event)">
      </label>
      <button class="btn" style="background:#ff4757;" onclick="clearQuiz()">🗑 Очистить всё</button>
    </div>

    <h2>Добавить новый вопрос</h2>
    <form id="addQuestionForm" enctype="multipart/form-data">
      <div class="form-group">
        <label>Вопрос:</label>
        <input type="text" id="questionText" required placeholder="Введите текст вопроса">
      </div>
      <div class="form-group">
        <label>Картинка (необязательно):</label>
        <input type="file" id="imageFile" accept="image/*">
      </div>
      <div class="form-group">
        <label>Время на ответ (сек):</label>
        <input type="number" id="timeLimit" value="20" required>
      </div>
      <div class="form-group"><label>Вариант 1 (Красный):</label><input type="text" id="opt0" required></div>
      <div class="form-group"><label>Вариант 2 (Синий):</label><input type="text" id="opt1" required></div>
      <div class="form-group"><label>Вариант 3 (Жёлтый):</label><input type="text" id="opt2" required></div>
      <div class="form-group"><label>Вариант 4 (Зелёный):</label><input type="text" id="opt3" required></div>
      <div class="form-group">
        <label>Правильный ответ:</label>
        <select id="correctIndex" style="width:100%; padding:10px; background:#0f3460; color:#fff; border-radius:6px;">
          <option value="0">Вариант 1</option>
          <option value="1">Вариант 2</option>
          <option value="2">Вариант 3</option>
          <option value="3">Вариант 4</option>
        </select>
      </div>
      <button type="submit" class="btn" style="width:100%;">Сохранить вопрос</button>
    </form>

    <hr style="margin: 30px 0; border-color: #0f3460;">
    <h2>Вопросы в текущей викторине</h2>
    <div id="questionsList"></div>
  </div>

  <script>
    let currentQuestions = [];

    async function loadQuestions() {
      const res = await fetch('/api/questions');
      currentQuestions = await res.json();
      renderQuestions();
    }

    function renderQuestions() {
      const container = document.getElementById('questionsList');
      container.innerHTML = '';
      currentQuestions.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.innerHTML = `
          <div class="controls-btn-group">
            <button class="icon-btn" onclick="moveQuestion(${idx}, -1)">🔼</button>
            <button class="icon-btn" onclick="moveQuestion(${idx}, 1)">🔽</button>
            <button class="icon-btn" onclick="cloneQuestion(${idx})">📋</button>
            <button class="icon-btn" style="border-color:#ff4757;" onclick="deleteQuestion(${q.id})">❌</button>
          </div>
          <h3>${idx + 1}. ${q.question}</h3>
          ${q.image ? `<img src="${q.image}" style="max-width:100%; max-height:150px; border-radius:6px; margin-bottom:10px;">` : ''}
          <p><strong>Ответы:</strong> 1) ${q.options[0]} | 2) ${q.options[1]} | 3) ${q.options[2]} | 4) ${q.options[3]}</p>
          <p><strong>Правильный:</strong> Вариант ${q.correctIndex + 1} | <strong>Время:</strong> ${q.timeLimit}с</p>
        `;
        container.appendChild(card);
      });
    }

    async function moveQuestion(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= currentQuestions.length) return;
      const temp = currentQuestions[index];
      currentQuestions[index] = currentQuestions[newIndex];
      currentQuestions[newIndex] = temp;
      
      await fetch('/api/questions/reorder', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ questions: currentQuestions })
      });
      renderQuestions();
    }

    async function cloneQuestion(index) {
      const q = currentQuestions[index];
      const cloned = { ...q, id: Date.now(), question: q.question + ' (Копия)' };
      currentQuestions.push(cloned);
      await fetch('/api/questions/reorder', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ questions: currentQuestions })
      });
      renderQuestions();
    }

    document.getElementById('addQuestionForm').onsubmit = async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('question', document.getElementById('questionText').value);
      formData.append('timeLimit', document.getElementById('timeLimit').value);
      formData.append('opt0', document.getElementById('opt0').value);
      formData.append('opt1', document.getElementById('opt1').value);
      formData.append('opt2', document.getElementById('opt2').value);
      formData.append('opt3', document.getElementById('opt3').value);
      formData.append('correctIndex', document.getElementById('correctIndex').value);
      
      const fileInput = document.getElementById('imageFile');
      if (fileInput.files[0]) {
        formData.append('image', fileInput.files[0]);
      }

      await fetch('/api/questions', { method: 'POST', body: formData });
      document.getElementById('addQuestionForm').reset();
      loadQuestions();
    };

    async function deleteQuestion(id) {
      if (confirm('Удалить этот вопрос?')) {
        await fetch(`/api/questions/${id}`, { method: 'DELETE' });
        loadQuestions();
      }
    }

    function exportQuiz() {
      window.location.href = '/api/questions/export';
    }

    function importQuiz(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const questions = JSON.parse(e.target.result);
          await fetch('/api/questions/import', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ questions })
          });
          alert('Викторина успешно загружена!');
          loadQuestions();
        } catch (err) {
          alert('Ошибка при чтении файла! Проверьте формат .json');
        }
      };
      reader.readAsText(file);
    }

    async function clearQuiz() {
      if (confirm('Очистить все текущие вопросы?')) {
        await fetch('/api/questions/clear', { method: 'DELETE' });
        loadQuestions();
      }
    }

    // Загрузка вопросов при открытии админки
    loadQuestions();
  </script>
</body>
</html>
