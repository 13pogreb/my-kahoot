<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>МОЇ ЛЮДИ kahoot!</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #46178f; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
    .card { background: #ffffff; color: #333333; padding: 35px 30px; border-radius: 20px; width: 90%; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); position: relative; box-sizing: border-box; }
    .lang-picker { position: absolute; top: 15px; right: 15px; background: #f0f0f0; border: 1px solid #ccc; padding: 5px 12px; border-radius: 15px; cursor: pointer; font-size: 14px; font-weight: bold; color: #333; transition: 0.2s; }
    .lang-picker:hover { background: #e0e0e0; }
    .brand { font-size: 32px; font-weight: 800; color: #46178f; margin-top: 10px; margin-bottom: 5px; letter-spacing: -0.5px; }
    .brand span { color: #f2a900; }
    .subtitle { font-size: 16px; color: #666666; margin-bottom: 25px; font-weight: 600; }
    .btn-group { display: flex; flex-direction: column; gap: 12px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; padding: 14px 20px; border-radius: 10px; font-size: 18px; font-weight: bold; color: #ffffff; transition: transform 0.1s, opacity 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.15); border: none; cursor: pointer; }
    .btn:active { transform: scale(0.98); }
    .btn-player { background: #e21b3c; }
    .btn-host { background: #1368ce; }
    .btn-admin { background: #26890c; }
    .btn-display { background: #8854d0; }
    .footer { font-size: 13px; color: #888888; margin-top: 25px; font-weight: bold; letter-spacing: 0.5px; }
    .bg-footer { position: absolute; bottom: 15px; font-size: 12px; opacity: 0.6; color: #fff; letter-spacing: 1px; }
  </style>
</head>
<body>

  <div class="card">
    <div class="lang-picker" onclick="toggleLang()"><span id="langLabel">🌐 UA</span></div>
    
    <div class="brand">МОЇ ЛЮДИ <span>kahoot!</span></div>
    <div class="subtitle" id="subText">Оберіть режим входу:</div>

    <div class="btn-group">
      <a href="/player.html" class="btn btn-player" id="btnPlayer">📱 Увійти як Гравець</a>
      <a href="/host.html" class="btn btn-host" id="btnHost">📺 Екран Ведучого</a>
      <button onclick="openDisplayWindow()" class="btn btn-display" id="btnDisplay">🖥 Вивести на ТБ / Проектор</button>
      <a href="/admin.html" class="btn btn-admin" id="btnAdmin">✏️ Конструктор / Адмінка</a>
    </div>

    <div class="footer">by pogrebnyak</div>
  </div>

  <div class="bg-footer">by pogrebnyak</div>

  <script>
    let currentLang = localStorage.getItem('appLang') || 'UA';

    const translations = {
      UA: {
        sub: 'Оберіть режим входу:',
        player: '📱 Увійти як Гравець',
        host: '📺 Екран Ведучого',
        display: '🖥 Вивести на ТБ / Проектор',
        admin: '✏️ Конструктор / Адмінка'
      },
      RU: {
        sub: 'Выберите режим входа:',
        player: '📱 Войти как Игрок',
        host: '📺 Экран Ведущего',
        display: '🖥 Вывести на ТВ / Проектор',
        admin: '✏️ Конструктор / Админка'
      }
    };

    function updateUI() {
      document.getElementById('langLabel').innerText = '🌐 ' + currentLang;
      document.getElementById('subText').innerText = translations[currentLang].sub;
      document.getElementById('btnPlayer').innerText = translations[currentLang].player;
      document.getElementById('btnHost').innerText = translations[currentLang].host;
      document.getElementById('btnDisplay').innerText = translations[currentLang].display;
      document.getElementById('btnAdmin').innerText = translations[currentLang].admin;
    }

    function toggleLang() {
      currentLang = currentLang === 'UA' ? 'RU' : 'UA';
      localStorage.setItem('appLang', currentLang);
      updateUI();
    }

    function openDisplayWindow() {
      // Открываем Экран Ведущего в отдельном окне без рамок для перетаскивания на Второй экран/ТВ
      window.open('/host.html', 'KahootDisplayWindow', 'width=1280,height=720,menubar=no,toolbar=no,location=no,status=no');
    }

    updateUI();
  </script>

</body>
</html>
