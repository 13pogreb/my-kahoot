<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kahoot - Выбор режима</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
    body { background: #46178f; color: white; margin: 0; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    .card { background: white; color: #333; max-width: 500px; width: 100%; padding: 40px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
    h1 { font-size: 2.8em; margin: 0 0 10px 0; color: #46178f; }
    p { font-size: 1.1em; color: #666; margin-bottom: 30px; }
    .btn-role { display: flex; align-items: center; justify-content: center; width: 100%; padding: 18px 25px; margin: 12px 0; font-size: 1.3em; font-weight: 900; text-decoration: none; border-radius: 14px; color: white; transition: transform 0.15s, box-shadow 0.15s; }
    .btn-role:active { transform: translateY(3px); }
    .btn-player { background: #e21b3c; box-shadow: 0 5px 0 #b0102b; }
    .btn-host { background: #1368ce; box-shadow: 0 5px 0 #0b4da2; }
    .btn-admin { background: #26890c; box-shadow: 0 5px 0 #185a06; }
    .icon { margin-right: 12px; font-size: 1.2em; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Kahoot!</h1>
    <p>Выберите режим входа:</p>
    
    <a href="/player.html" class="btn-role btn-player">
      <span class="icon">📱</span> Войти как Игрок
    </a>
    
    <a href="/host.html" class="btn-role btn-host">
      <span class="icon">📺</span> Экран Ведущего
    </a>
    
    <a href="/admin.html" class="btn-role btn-admin">
      <span class="icon">✏️</span> Конструктор / Админка
    </a>
  </div>
</body>
</html>
