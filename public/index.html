<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>МОЇ ЛЮДИ kahoot!</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #46178f; color: #fff; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; }
    .card { background: #ffffff; color: #333333; padding: 35px 30px; border-radius: 20px; width: 90%; max-width: 420px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); position: relative; box-sizing: border-box; }
    .lang-picker { position: absolute; top: 15px; right: 15px; background: #f0f0f0; border: 1px solid #ccc; padding: 5px 12px; border-radius: 15px; cursor: pointer; font-size: 14px; font-weight: bold; color: #333; transition: 0.2s; }
    .lang-picker:hover { background: #e0e0e0; }
    .brand { font-size: 32px; font-weight: 800; color: #46178f; margin-top: 10px; margin-bottom: 5px; letter-spacing: -0.5px; }
    .brand span { color: #f2a900; }
    .subtitle { font-size: 16px; color: #666666; margin-bottom: 25px; font-weight: 600; }
    .btn-group { display: flex; flex-direction: column; gap: 12px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; padding: 14px 20px; border-radius: 10px; font-size: 18px; font-weight: bold; color: #ffffff; transition: transform 0.1s, opacity 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.15); border: none; cursor: pointer; position: relative; }
    .btn:active { transform: scale(0.98); }
    .btn-admin { background: #26890c; }
    .btn-events { background: #0f3460; cursor: not-allowed; opacity: 0.85; }
    .badge { position: absolute; right: 10px; top: 10px; background: #ff4757; color: #fff; font-size: 10px; font-weight: bold; padding: 3px 7px; border-radius: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .btn-player { background: #333333; font-size: 15px; padding: 10px; }
    .footer { font-size: 13px; color: #888888; margin-top: 25px; font-weight: bold; letter-spacing: 0.5px; }
    .bg-footer { position: absolute; bottom: 15px; font-size: 12px; opacity: 0.6; color: #fff; letter-spacing: 1px; }
    
    input[type="text"] { width: 100%; padding: 14px; margin: 15px 0; border: 2px solid #46178f; border-radius: 10px; font-size: 18px; font-weight: bold; text-align: center; text-transform: uppercase; box-sizing: border-box; }
  </style>
</head>
<body>

  <div class="card">
    <div class="lang-picker" onclick="toggleLang()"><span id="langLabel">🌐 UA</span></div>
    <div class="brand">МОЇ ЛЮДИ <span>kahoot!</span></div>

    <!-- Экран ввода ключа (показывается каждый раз) -->
    <div id="licenseAuthBlock">
      <div class="subtitle">Введіть ваш ключ ліцензії:</div>
      <input type="text" id="licenseInput" placeholder="MLK26-XXXX-XXXX-XXXX">
      <button class="btn btn-admin" style="width:100%;" onclick="activateKey()">АКТИВУВАТИ</button>
      <p id="licErr" style="color:#ff4757; font-size:14px; margin-top:10px; font-weight:bold;"></p>
    </div>

    <!-- Главное меню -->
    <div id="mainMenuBlock" style="display: none;">
      <div class="subtitle" id="subText">Оберіть режим:</div>
      <div class="btn-group">
        <a href="/admin.html" class="btn btn-admin" id="btnAdmin">✏️ Конструктор та Запуск Гри</a>
        
        <div class="btn btn-events" onclick="alert('Розділ знаходиться в розробці!')">
          🎉 Івенти
          <span class="badge">In Development</span>
        </div>

        <a href="/player.html" class="btn btn-player" id="btnPlayer">📱 Тест входу для Гравця</a>
      </div>
    </div>

    <div class="footer">by pogrebnyak</div>
  </div>

  <div class="bg-footer">by pogrebnyak</div>

  <script>
    let currentLang = localStorage.getItem('appLang') || 'UA';

    const translations = {
      UA: {
        sub: 'Оберіть режим:',
        admin: '✏️ Конструктор та Запуск Гри',
        player: '📱 Тест входу для Гравця'
      },
      RU: {
        sub: 'Выберите режим:',
        admin: '✏️ Конструктор и Запуск Игры',
        player: '📱 Тест входа для Игрока'
      }
    };

    async function activateKey() {
      const input = document.getElementById('licenseInput').value.trim();
      if (!input) {
        document.getElementById('licErr').innerText = 'Будь ласка, введіть ключ!';
        return;
      }

      const res = await fetch('/api/license/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ licenseKey: input })
      });
      const data = await res.json();

      if (data.valid) {
        // Сохраняем ТОЛЬКО на время текущей сессии вкладки
        sessionStorage.setItem('licenseKey', input);
        showMenu();
      } else {
        document.getElementById('licErr').innerText = data.message;
      }
    }

    function showMenu() {
      document.getElementById('licenseAuthBlock').style.display = 'none';
      document.getElementById('mainMenuBlock').style.display = 'block';
    }

    function updateUI() {
      document.getElementById('langLabel').innerText = '🌐 ' + currentLang;
      document.getElementById('subText').innerText = translations[currentLang].sub;
      document.getElementById('btnAdmin').innerText = translations[currentLang].admin;
      document.getElementById('btnPlayer').innerText = translations[currentLang].player;
    }

    function toggleLang() {
      currentLang = currentLang === 'UA' ? 'RU' : 'UA';
      localStorage.setItem('appLang', currentLang);
      updateUI();
    }

    // Очищаем старые записи из вечной памяти localStorage
    localStorage.removeItem('licenseKey');

    // Проверяем сессию только текущей вкладки
    const sessionKey = sessionStorage.getItem('licenseKey');
    if (sessionKey) {
      fetch('/api/license/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ licenseKey: sessionKey })
      }).then(r => r.json()).then(data => {
        if (data.valid) showMenu();
        else sessionStorage.removeItem('licenseKey');
      });
    }

    updateUI();
  </script>

</body>
</html>
